services:
  - type: web
    name: vox
    runtime: docker
    plan: free
    healthCheckPath: /login/
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vox-db
          property: connectionString

databases:
  - name: vox-db
    plan: free
